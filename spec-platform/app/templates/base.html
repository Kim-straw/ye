<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>{% block title %}스펙로드{% endblock %}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <!-- 글꼴: 인터넷이 없으면 컴퓨터에 있는 글꼴로 대신 보임 -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand"><b>스펙로드</b><span>고려대학교 세종캠퍼스</span></a>
    {% if user %}<span class="who">{{ user.nickname }} · {{ user.department.name }}</span>{% endif %}
  </header>

  <main class="page">
    {% block content %}{% endblock %}
    <p class="legal">고려대학교 세종캠퍼스 학생이 만든 비공식 프로젝트이며, 학교의 공식 서비스가 아닙니다. 모든 정보는 원문 공지를 반드시 확인하세요. <a href="/privacy">개인정보 안내</a></p>
  </main>

  <!-- 앱처럼 보이게 하는 하단 탭 -->
  <div class="tabbar"><nav aria-label="하단 메뉴">
    <a href="/me" class="{{ 'on' if request.url.path == '/me' }}" {{ 'aria-current=page' if request.url.path == '/me' }}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8 6.8 19.6l1-5.8L3.5 9.7l5.9-.9L12 3.5z"/></svg>추천</a>
    <a href="/opportunities" class="{{ 'on' if request.url.path.startswith('/opportunities') }}" {{ 'aria-current=page' if request.url.path.startswith('/opportunities') }}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"/></svg>활동</a>
    <a href="/recruit" class="{{ 'on' if request.url.path.startswith('/recruit') }}" {{ 'aria-current=page' if request.url.path.startswith('/recruit') }}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="7.5" width="17" height="12" rx="1.5"/><path d="M9 7.5V5.5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3.5 12.5h17"/></svg>인턴·채용</a>
    <a href="/profile/new" class="{{ 'on' if request.url.path.startswith('/profile') }}" {{ 'aria-current=page' if request.url.path.startswith('/profile') }}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>내 정보</a>
  </nav></div>

  <script>
    // 서비스 워커 등록: 폰 '홈 화면에 추가'와 오프라인 안내를 가능하게 함
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
  </script>
</body>
</html>
