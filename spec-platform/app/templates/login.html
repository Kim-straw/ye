{% extends "base.html" %}
{% block title %}로그인 · 스펙로드{% endblock %}
{% block content %}
<header class="head stack">
  <h1>로그인</h1>
</header>

{# 비밀번호는 주소(URL)에 남지 않도록 POST 본문으로만 보냄 #}
<form method="post" action="/login" class="form">
  {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
  <label class="field" for="login_id">아이디
    <input id="login_id" type="text" name="login_id" required maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false" value="{{ login_id }}">
  </label>
  <label class="field" for="password">비밀번호
    <input id="password" type="password" name="password" required maxlength="72" autocomplete="current-password">
  </label>
  <button class="btn" type="submit" style="margin:0">로그인</button>
</form>

<p class="hint center" style="margin-top:1.2rem">처음이신가요? <a href="/profile/new">프로필 만들기</a></p>
<p class="fine center">비밀번호를 잊으면 새 프로필을 만들어야 해요</p>
{% endblock %}
